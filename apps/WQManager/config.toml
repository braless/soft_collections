# altgen config for the WQManager AltStore source.
# Run: uvx altgen -c config.toml
# Identity was read from the released IPA:
# Payload/WQManager.app/Info.plist -> mumu.pduola.WQManager, 0.3.1, build 3.

[github]
repo = "hseons/WQManager"

[source]
name = "WQManager"
subtitle = "WQManager AltStore source by soft_collections & altgen"
description = "Auto-updated AltStore source for WQManager"
icon_url = "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/WQManager/icon.png"
website = "https://github.com/hseons/WQManager"
tint_color = "#242529"

[app]
name = "WQManager"
bundle_identifier = "mumu.pduola.WQManager"
developer_name = "hseons"
subtitle = "iOS 26 App 数据管理与缓存清理工具"
description = "面向 iOS 26+ 的开源 App 数据管理、备份与单应用缓存清理工具：支持带哈希校验和安全回滚的数据备份恢复，以及按目录清理缓存；发布包为 unsigned IPA，真机使用需以保留 App Group 权限的付费开发者证书签名。"
icon_url = "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/WQManager/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/WQManager/images/01-apps.png",
  "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/WQManager/images/02-cleaner.png",
  "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/WQManager/images/03-history.png",
  "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/WQManager/images/04-settings.png",
]
tint_color = "#242529"
min_os_version = "26.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# asset_pattern is a regex (not glob): releases ship the unsigned IPA.
asset_pattern = "(?i)^WQManager-.*-unsigned\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
image_url = "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/WQManager/images/news.png"

[output]
path = "apps.json"