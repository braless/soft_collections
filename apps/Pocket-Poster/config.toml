# altgen config for the Pocket Poster AltStore source.
# Run: uvx altgen -c config.toml
# App fields mirror the project's own AltStore source
# (https://github.com/SerStars/Nugget-Wallpapers/blob/main/other/pocketposter_source.json),
# which the README links to; the icon is hosted here from the repo's asset catalog.

[github]
repo = "leminlimez/Pocket-Poster"

[source]
name = "Pocket Poster"
subtitle = "Pocket Poster AltStore source by soft_collections & altgen"
description = "Auto-updated AltStore source for Pocket Poster"
icon_url = "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/Pocket-Poster/icon.png"
website = "https://github.com/leminlimez/Pocket-Poster"
tint_color = "#DD94F3"

[app]
name = "Pocket Poster"
bundle_identifier = "com.lemin.Pocket-Poster"
developer_name = "LeminLimez"
subtitle = "Custom PosterBoard animated wallpapers for iOS 17.0+"
description = "Custom PosterBoard animated wallpapers for iOS 17.0+. Browse community wallpapers in the built-in explore page, import your own videos and images, and apply them as animated posters — including CarPlay and per-collection sets."
icon_url = "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/Pocket-Poster/icon.png"
tint_color = "#DD94F3"
min_os_version = "17.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# asset_pattern is a regex (not glob): every release ships one IPA, named
# Pocket_Poster.ipa except v2.0.1 which used Pocket.Poster.ipa.
asset_pattern = "Pocket[._]Poster\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by templates/render_news.py
image_url = "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/Pocket-Poster/images/news.png"

[output]
path = "apps.json"
