# altgen config for the DoubanMApp AltStore source.
# Run: uvx altgen -c config.toml
#
# The project ships no AltStore source, and its repository configuration no
# longer matches the builds it releases: main targets Douban 7.134.0 and adds
# a ".dddd" bundle-id suffix, while the released IPA (1.1.0) is built on Douban
# 7.109.0 and keeps the official bundle identifier. Everything below was read
# from that IPA's Payload/DoubanMApp.app/Info.plist.

[github]
repo = "TouchFriend/DoubanMApp"

[source]
name = "豆瓣"
subtitle = "DoubanMApp AltStore source by soft_collections & altgen"
description = "Auto-updated AltStore source for DoubanMApp, the ad-free Douban client"
icon_url = "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/DoubanMApp/icon.png"
website = "https://github.com/TouchFriend/DoubanMApp"
tint_color = "#02AD0A"

[app]
name = "豆瓣"
bundle_identifier = "com.douban.frodo"
developer_name = "TouchFriend"
subtitle = "无广告版豆瓣客户端（DoubanMApp）"
description = "通过 iOS 逆向改造的豆瓣客户端：移除绝大多数广告、精简界面，其余功能与官方客户端保持一致。发布包基于豆瓣 7.109.0 修改，所以应用内显示的版本号仍是 7.109.0，而本源里的版本号用的是该项目自己的发布号。它的 bundle ID 与官方豆瓣相同，两者不能同时安装。"
icon_url = "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/DoubanMApp/icon.png"
tint_color = "#02AD0A"
# Read from the released IPA (MinimumOSVersion). The current main branch asks
# for 15.0, but the shipped 1.1.0 build declares 13.0.
min_os_version = "13.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# asset_pattern is a regex (not glob): every release ships the IPA plus an
# unpacked .app.zip — match only the IPA.
asset_pattern = "^douban-.*\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by templates/render_news.py
image_url = "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/DoubanMApp/images/news.png"

[output]
path = "apps.json"
