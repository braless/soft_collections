# render_news.py config: python3 templates/render_news.py --out apps/DoubanMApp
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "豆瓣"
tagline = "无广告版豆瓣客户端"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# The badge uses a darker green than the app's tint (#02AD0A): the background
# below it is a pale green too, and the vivid one only reaches ~2.4:1 there.
tint = "#0B7A15"
# tint_alt = "#02AD0A"      # bottom-right glow (default: [source] tint_color)
# background = "#D6EBD6"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#E7F3E7"        # gradient mid stop (derived from background)
# bg_dark = "#BBDEBB"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#51BD51" # tagline text (derived from background)
