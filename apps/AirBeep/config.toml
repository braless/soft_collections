# altgen config for the AirBeep AltStore source.
# Run: uvx altgen -c config.toml
# No AltStore source upstream: identity was read from the released IPA
# (Payload/airbeep.app/Info.plist) — com.linkpass888.airbeep, 2.2.0, build 4.
#
# The binary declares MinimumOSVersion 26.0, but the README lists the supported
# releases as "iOS/iPadOS 27.0 - 27.2 B2" and the app writes iOS 27 recording
# files, so the source advertises 27.0. The icon comes from the Icon Composer
# sources (Appicon.icon/Assets/call-recording-sound-icon-v5.png, 1024px).

[github]
repo = "LinkPass888/AirBeep"

[source]
name = "AirBeep"
subtitle = "AirBeep AltStore source by soft_collections & altgen"
description = "Auto-updated AltStore source for AirBeep"
icon_url = "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/AirBeep/icon.png"
website = "https://github.com/LinkPass888/AirBeep"
tint_color = "#0057D9"

[app]
name = "AirBeep"
bundle_identifier = "com.linkpass888.airbeep"
developer_name = "LinkPass888"
subtitle = "静音通话录音提示音"
description = "把 iOS 通话录音的开始与结束提示音替换成等长静音：一个开关完成替换，替换前会自动备份原文件（备份永不覆盖），并支持一键还原；每次写入都会回读校验。支持英文与简体中文界面。"
icon_url = "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/AirBeep/icon.png"
tint_color = "#0057D9"
min_os_version = "27.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# asset_pattern is a regex (not glob): every release ships one IPA
asset_pattern = "^airbeep-v.*-unsigned\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by templates/render_news.py
image_url = "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/AirBeep/images/news.png"

[output]
path = "apps.json"
