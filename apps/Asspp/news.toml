# render_news.py config: python3 templates/render_news.py --out apps/Asspp
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "Asspp"
tagline = "Multi-region App Store manager for iOS"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#3060D0"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#3060D0"      # bottom-right glow (default: [source] tint_color)
# background = "#D6DCEB"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#E7EBF3"        # gradient mid stop (derived from background)
# bg_dark = "#BBC5DE"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#5170BD" # tagline text (derived from background)
