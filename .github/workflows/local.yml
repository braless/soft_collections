name: Update Local source

# apps/Local/ holds IPAs that are committed here instead of being released on
# GitHub. scripts/local_source.py reads each IPA (name, bundle id, version,
# icon) offline, and this job merges the result into all-apps.json and
# regenerates the gh-proxy.com mirrors. The altgen-based update.yml
# deliberately ignores this folder.

on:
  push:
    branches:
      - main
    paths:
      - 'apps/Local/**'
      - 'scripts/local_source.py'
      - 'scripts/make_proxy.py'
      - '.github/workflows/local.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: altstore-sources
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: each version's date is the commit date of its IPA,
          # which a shallow clone cannot resolve.
          fetch-depth: 0

      # `uvx altgen merge` needs uv; both Python helpers use the standard
      # library only.
      - uses: astral-sh/setup-uv@v7

      - name: Build Local source, commit and push
        # The source and proxy mirrors are rebuilt from scratch when a push is
        # rejected: they are derived from the committed IPAs and existing app
        # sources, and update.yml may have started in the same second and
        # pushed first (GitHub's concurrency queue is best-effort).
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            echo "--- attempt ${attempt}: rebuilding the Local source"

            python3 scripts/local_source.py
            uvx altgen merge -c assets/merge.toml apps/*/apps.json
            python3 scripts/make_proxy.py --all

            git add -A apps/Local
            git add -f apps/Local/apps.json apps/Local/apps-proxy.json all-apps.json all-apps-proxy.json apps/*/apps-proxy.json

            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi

            git commit -q -m "chore: update Local source and proxy mirrors"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi

            echo "--- push rejected: rebuilding on the new tip"
            git fetch --quiet origin "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
          done

          echo "could not push after 4 attempts" >&2
          exit 1
