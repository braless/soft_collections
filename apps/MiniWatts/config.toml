# altgen config for the MiniWatts AltStore source.
# Run: uvx altgen -c config.toml
# The project ships no AltStore source of its own: the bundle identifier and
# deployment target come from MiniWatts.xcodeproj, the rest from the repo.

[github]
repo = "ResistanceTo/MiniWatts"

[source]
name = "MiniWatts"
subtitle = "MiniWatts AltStore source by soft_collections & altgen"
description = "Auto-updated AltStore source for MiniWatts"
icon_url = "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/MiniWatts/icon.png"
website = "https://github.com/ResistanceTo/MiniWatts"
tint_color = "#30F040"

[app]
name = "MiniWatts"
bundle_identifier = "org.zhaohe.MiniWatts"
developer_name = "ZhaoHe Studio"
subtitle = "Battery, charging and thermal instrument for iPhone"
description = "A battery, charging and thermal instrument for iPhone, built on Apple's private power-management APIs. It shows what the charger is delivering, how much of it reaches the cell, where the rest goes as heat, and what the phone's temperature sensors are doing while it happens."
icon_url = "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/MiniWatts/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/MiniWatts/images/power.jpg",
  "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/MiniWatts/images/thermal.jpg",
  "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/MiniWatts/images/adapter.jpg",
  "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/MiniWatts/images/history.jpg",
]
tint_color = "#30F040"
min_os_version = "17.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# asset_pattern is a regex (not glob): each release ships one unsigned IPA
asset_pattern = "MiniWatts-.*\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by templates/render_news.py
image_url = "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/MiniWatts/images/news.png"

[output]
path = "apps.json"
