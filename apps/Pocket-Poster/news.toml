# render_news.py config: python3 templates/render_news.py --out apps/Pocket-Poster
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "Pocket Poster"
tagline = "Custom PosterBoard animated wallpapers for iOS 17+"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#DD94F3"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#DD94F3"      # bottom-right glow (default: [source] tint_color)
# background = "#EBD6E8"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#F3E7F2"        # gradient mid stop (derived from background)
# bg_dark = "#DEBBD9"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#BD51AE" # tagline text (derived from background)
