# altgen config for the Camlo AltStore source.
# Run: uvx altgen -c config.toml
# Identity was read from the project's own AltStore source (apps.json):
# com.kianuni.Camlo, 1.3.0, build 23, minOS 26.0.

[github]
repo = "Kianuni/Camlo"

[source]
name = "Camlo"
subtitle = "Camlo AltStore source by soft_collections & altgen"
description = "Auto-updated AltStore source for Camlo"
icon_url = "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/Camlo/icon.png"
website = "https://github.com/Kianuni/Camlo"
tint_color = "#6B4EFF"

[app]
name = "Camlo"
bundle_identifier = "com.kianuni.Camlo"
developer_name = "Kianuni"
subtitle = "零门槛「滑动解锁变身 + 动态锁屏」壁纸工坊"
description = "让 iPhone 锁屏活起来：免电脑、免越狱一键直写上滑变身与动态锁屏，支持裸眼 3D 景深、人物遮挡时间、昼夜双生壁纸与 120Hz 实时预览，内置 6 套风光预设与 385+ 款官方云端壁纸（iOS 26+）。"
icon_url = "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/Camlo/icon.png"
tint_color = "#6B4EFF"
min_os_version = "26.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# asset_pattern is a regex (not glob): releases ship one localized IPA asset.
asset_pattern = "Camlo_.*\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
image_url = "https://raw.githubusercontent.com/braless/soft_collections/refs/heads/main/apps/Camlo/images/news.png"

[output]
path = "apps.json"
